guideline.rcon.text=\n\
# A polite request:\n\
```\n\
Please do not attempt this on your own if you are not well-versed in it.\n\
You can join our support server (/guideline support) or ask someone knowledgeable to help you and secure your server.
```\n\
To set up RCON, you first need to configure it on your Minecraft server.\n\
For this, go to your server settings (server.properties), find the enable-rcon option and change its value to true, then you need to set a password for your RCON. Look for the rcon.password option and set a password.\n\
Next, optionally and if possible, change the rcon.port.
